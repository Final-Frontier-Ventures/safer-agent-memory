[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-standard"
version = "0.1.0"
description = "Security-first memory for AI agents: scoped tiers, taint tracking, tenant isolation and reviewed consolidation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "memory", "llm", "prompt-injection", "ai-security", "claude-code", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ams = "ams.cli:main"

[tool.setuptools]
packages = ["ams"]

[tool.pytest.ini_options]
testpaths = ["conformance", "tests"]
